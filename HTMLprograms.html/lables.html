<!DOCTYPE html>
<html>
<head>
    <title>Form Elements</title>
</head>
<body>
    <form method="get" action="#"
        oninput="total.value = Number(a.value) + Number(b.value)">
    <label for="a">First number:</label>
    <input type="number" id="a" name="a" value="10"><br><br>
    <label for="b">Second number:</label>
    <input type="number" id="b" name="b" value="20"><br><br>
    Sum = <output name="total" for="a b">30</output><br><br>
    <label for="car">Choose a vehicle:</label>
    <select id="car" name="car">
        <optgroup label="Two Wheeler">
        <option>Bike</option>
        <option>Scooter</option>
      </optgroup>
      <optgroup label="Four Wheeler">
        <option>Car</option>
        <option>Jeep</option>
      </optgroup>
    </select><br><br>
    <button type="submit">Send</button>
    <button type="reset">Clear</button>
</form>
</body>
</html>
