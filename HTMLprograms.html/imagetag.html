<!DOCTYPE html>
<html>
    <head>
        <title>IMAGE TAG</title>
    </head>
    <body>
        <h2>Image Example</h2>
        <img src = "logo.png" alt = "college logo" width = "150" height = "150" border = "2"> 
        <p>Image with text alignment :</p>
        <img src = "logo.png" alt = "logo" width = "80" height = "80" align = "left" hspace = "10">
            This text appears on the right side of the image beacause ALIGN is set to left.
            <br clear = "all"><br>
            <p>Image with text alignment :Image as a link(click the image:)</p>
            <a href = "https://www.w3.org">
                <img src = "logo.png" alt = "Go to w3c" width = "80" height = "80">
            </a>
    </body> 
</html>
