<!DOCTYPE html>
<html>
    <head>
        <title>Ordered List</title>
    </head>
    <body>
        <h3>Type = 1</h3>
        <ol type="1">
            <li>Beetroot</li>
            <li>Ginger</li>
            <li>Potato</li>
        </ol>
        <h3>Type = A</h3>
        <ol type="A">
            <li>Beetroot</li>
            <li>Ginger</li>
            <li>Potato</li>
        </ol>
        <h3>Type = I start = 3</h3>
        <ol type="I" start="3">
            <li>Beetroot</li>
            <li>Ginger</li>
            <li>Potato</li>
        </ol>
        <h3>Type = i </h3>
        <ol type="i" start="3">
            <li>Beetroot</li>
            <li>Ginger</li>
            <li>Potato</li>
        </ol>
    </body>
</html>
