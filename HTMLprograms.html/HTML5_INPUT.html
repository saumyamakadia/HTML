<!DOCTYPE html>
<html lang="en">
<head>
    <title>HTML5 INPUT TYPES</title>
</head>
<body>
    <h2>HTML5 Input Types</h2>
    <form>
        Email: <input type="email" name="email"><br><br>
        Website: <input type="url" name="site"><br><br>
        Birth date: <input type="date" name="bob"><br><br>
        Time: <input type="time" name="t"><br><br>
        Favourite colour: <input type="color" name="clr"><br><br>
        Search: <input type="search" name="q"><br><br>
        Age(1-100): <input type="number" name="age" min="1" max="100"><br><br>
        Marks: <input type="range" name="marks" min="0" max="100"><br><br>
        <input type="submit" value="Submit">
    </form>
</body>
</html>
