<!DOCTYPE html>
<html>
    <head>
        <title>Unordered List</title>
    </head>
    <body>
        <h3>DISC </h3>
        <ul type="disc">
            <li>Beetroot</li>
            <li>Ginger</li>
            <li>Potato</li>
        </ul>
        <H3>SQUARE</H3>
        <ul type="square">
            <li>Beetroot</li>
            <li>Ginger</li>
            <li>Potato</li>
        </ul>
        <H3>NESTED LIST</H3>
        <ul>
            <li>Web technology</LI>
                <ol>
                    <li>HTML</li>
                    <li>CSS</li>
                </ol>
                <li>Programming language</li>
                <ul type="square">
                    <li>C</li>
                    <li>Java</li>    

        </ul>
    </body>
</html>
