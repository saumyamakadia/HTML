<!DOCTYPE html>
<html>
<head>
    <title>Margin & Padding Example</title>
    <style>
        h1 {
            margin-left: 25px;
        }
        p.one {
            padding: 35px 15px;
	background-color: lightgreen;
        }
        p.two {
            margin: 50px 100px;
            background-color: lightpink
        }
    </style>
</head>
<body>
    <h1>Margin & Padding Demonstration</h1>
    <p class="one">This paragraph has padding on the top/bottom(35px)and left/right(15px).</p>
    <p class="two">This paragraph has margin on the top/bottom(50px)and left/right(100px).</p>
</body>
</html>
