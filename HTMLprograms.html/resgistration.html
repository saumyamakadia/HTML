<!DOCTYPE html>
<html>
<head>
    <title>Registration Form</title>
</head>
<body>
    <h2>Student Registration</h2>
    <form name="reg" action="Submit.php" method="post">
        name: <input type="text" name="name" placeholder="full name" required><br><br>
        password: <input type="password" name="pwd" placeholder="password"><br><br>
        Gender:
        <input type="radio" name="gender" value="male"> Male
        <input type="radio" name="gender" value="female"> Female<br><br>
        Hobbies:
        <input type="checkbox" name="h1"> Reading
        <input type="checkbox" name="h2"> Travelling
        <input type="checkbox" name="h3"> Music<br><br>
        Course:
        <select name="course">
            <option>BCA</option>
            <option>BBA</option>
            <option>BCom</option>
        </select><br><br>
        Address:
        <textarea name="address" rows="5" cols="30"></textarea><br><br>
        <input type="submit" value="Submit">
        <input type="reset" value="Reset">
    </form>
</body>
</html>
