<!DOCTYPE html>
<html>
<head>
    <title>Float & Clear Example</title>
    <style>
        .box-1 {
            float: left;
            width: 100px;
            height: 100px;
            background-color: coral;
        }
        .box-2 {
            float: left;
            width: 100px;
            height: 100px;
            background-color: khaki;
        }
        .box-3 {
            float: left;
            width: 100px;
            height: 100px;
            background-color: lightgreen;
        }
        .cleared {
            clear: both;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <h2>Float & Clear Demonstration</h2>
    <div class="box-1">Box1</div>
    <div class="box-2">Box2</div>
    <div class="box-3">Box3</div>
    <p class="cleared">This text is cleared and appears below all floated boxes.</p>
</body>
</html>
