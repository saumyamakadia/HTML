<!DOCTYPE html>
<html>
<head>
    <title>Frames</title>
</head>
<body>
    <frameset rows="20%,80%" border="2" bordercolor="blue">
        <frame src="top.html" name="top" scrolling="no">
        <frameset cols="25%,75%">
            <frame src="menu.html" name="menu">
            <frame src="content.html" name="content" scrolling="auto">
        </frameset>
        </frameset>
</body>
</html>
